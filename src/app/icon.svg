<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Invoice">
  <!-- Source of truth for the app icon. The PNGs under public/ and
       src/app/apple-icon.png are rendered from this file; regenerate them if
       you change it (see README, "Changing the icon"). -->
  <rect width="100" height="100" fill="#1d4e89"/>

  <!-- Receipt body, rounded at the top, straight at the bottom -->
  <path d="M24 10 h52 a4 4 0 0 1 4 4 v66 h-60 v-66 a4 4 0 0 1 4 -4 z" fill="#ffffff"/>
  <!-- Torn bottom edge: the detail that makes it read as a receipt -->
  <path d="M20 80 L25 88 L30 80 L35 88 L40 80 L45 88 L50 80 L55 88 L60 80 L65 88 L70 80 L75 88 L80 80 L80 78 L20 78 Z" fill="#ffffff"/>

  <rect x="31" y="24" width="38" height="6"   rx="3"   fill="#1d4e89"/>
  <rect x="31" y="40" width="38" height="4"   rx="2"   fill="#8fa6c4"/>
  <rect x="31" y="50" width="26" height="4"   rx="2"   fill="#8fa6c4"/>
  <rect x="31" y="63" width="38" height="7"   rx="3.5" fill="#1d4e89"/>
</svg>
